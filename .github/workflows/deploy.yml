name: Deploy MCP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seohost-mcp-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package runtime files
        run: bash deploy/package.sh "$RUNNER_TEMP/bundle.tar.gz"
      - name: Deploy through SSH and verify HTTPS
        shell: bash
        env:
          SSH_HOST: ${{ vars.SEOHOST_SSH_HOST }}
          SSH_PORT: ${{ vars.SEOHOST_SSH_PORT }}
          SSH_USER: ${{ vars.SEOHOST_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SEOHOST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SEOHOST_SSH_KNOWN_HOSTS }}
          APP_ROOT: ${{ vars.SEOHOST_APP_ROOT }}
          NODE_BIN: ${{ vars.SEOHOST_NODE_BIN }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$APP_ROOT" =~ ^[a-zA-Z0-9_/-]+$ && "$APP_ROOT" != /* && "$APP_ROOT" != */ && "$APP_ROOT" != *//* ]]
          [[ "$NODE_BIN" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo '::error::Missing SEOHOST_SSH_PRIVATE_KEY. Set the production environment secret or grant this repository access to the repository/organization secret.'
            exit 1
          fi
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/seohost-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          node --input-type=module - "$ssh_dir/key" <<'NODE'
          import { writeFileSync } from 'node:fs'
          let key = process.env.SSH_PRIVATE_KEY.trim()
          if (key.startsWith('"') && key.endsWith('"')) {
            try { key = JSON.parse(key) } catch { throw new Error('SSH key has invalid JSON string formatting') }
          }
          if (typeof key !== 'string') throw new Error('Expected SSH private key text')
          key = key.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\r/g, '')
            .split('\n').map(line => line.trim()).join('\n').trim() + '\n'
          if (!/^-----BEGIN (?:OPENSSH |RSA |EC )?PRIVATE KEY-----\n/.test(key)) {
            throw new Error('Expected a complete SSH private key block')
          }
          writeFileSync(process.argv[2], key, { mode: 0o600 })
          NODE
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > "$ssh_dir/public"; then
            echo '::error::SSH key is invalid or encrypted. Supply the complete existing private key without a passphrase; do not paste a public key.'
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          opts=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20)
          target="$SSH_USER@$SSH_HOST"
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "umask 077; mkdir -p .seohost-mcp-deploy; mkdir .seohost-mcp-deploy/$RELEASE_ID"
          scp "${opts[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/bundle.tar.gz" "$target:.seohost-mcp-deploy/$RELEASE_ID/bundle.tar.gz"
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "bash -s -- '$APP_ROOT' '$NODE_BIN' '$RELEASE_ID'" < deploy/remote.sh
